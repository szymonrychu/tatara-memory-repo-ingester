name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    # CD-MANAGED PIN. tatara-operator's release.yml `fanout-ci-shared` job
    # rewrites this line on every release that changes ci-shared.yml, and its
    # scheduled `ci-shared-currency` check reds when it falls behind
    # (tatara-operator#640). Do not hand-edit it: a hand bump is overwritten by
    # the next release while the real fault stays open.
    #
    # THE PIN IS ONLY HALF OF THE CONTRACT. `enable-image-verify` is
    # deliberately NOT set below, so it keeps its default of true and the
    # shared `image-verify` job compiles this repo's Dockerfile on every pull
    # request - the merge gate #556 asked for. Setting it false HERE would be
    # invisible to that currency check, because ci-shared.yml at this pin is
    # byte-identical either way; that is why the same check also reds
    # `gate-dark` on any consumer that opts out without a matching
    # `cicontract.ImageVerifyExempt` entry, with a reason, in tatara-operator.
    # So an opt-out is a reviewed diff against the producer, not one line here.
    # If image-verify goes red, the Dockerfile break it found is the thing to
    # fix - turning the gate off to get a green PR is how it went dark the
    # first time.
    uses: szymonrychu/tatara-operator/.github/workflows/ci-shared.yml@v3.10.0
    with:
      runner-label: tatara-memory-repo-ingester
      smoke-binary: ./bin/tatara-ingest
      # ingester's `make build` is CGO_ENABLED=1 (the static-analysis tooling
      # links cgo), so build/smoke need the full C toolchain, not just make.
      build-needs-cgo: true
      # ingester owns its own image publish (build.sh's PUSH_SHORT_SHA_TAG
      # toggle, reused by release.yml to avoid a duplicate immutable Harbor
      # tag push), so the shared `image` job stays off here.
      enable-image: false
    secrets: inherit

  image:
    if: ${{ github.event_name == 'push' }}
    runs-on: tatara-memory-repo-ingester
    needs: [ci]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install buildctl
        run: |
          curl -sSfL "https://github.com/moby/buildkit/releases/download/v0.18.2/buildkit-v0.18.2.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local bin/buildctl
      - name: build and push image
        run: bash .github/ci/build.sh "${{ github.event.repository.name }}"
